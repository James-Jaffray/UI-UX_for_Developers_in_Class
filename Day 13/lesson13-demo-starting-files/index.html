<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox | Demo</title>
    <!-- css reset goes here -->
    <link rel="stylesheet" href="css/reset.css">
    <!-- css styles goes here -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="inner-container">
        <header>
            <h1>Flexing Elements</h1>
        </header>
        <main>
            <div class="flex-container">
                <div class="red-paint"></div>
                <div class="blue-paint"></div>
            </div>
            <div class="flex-container">
                <div class="green-paint"></div>
                <div class="yellow-paint"></div>
                <div class="orange-paint"></div>
            </div>
        </main>
        <footer class="flex-container">
            <div class="red-paint"></div>
            <div class="blue-paint"></div>
            <div class="red-paint margin-left"></div>
            <div class="blue-paint"></div>
        </footer>
    </div>
</body>

</html>
