<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cream Shop | Order</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="inner-container">
        <main>
            <form action="index.html" method="post">
                <h2>Ice Cream Order</h2>
                <!-- INPUT TYPES:
                    https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input -->

                <!-- RADIO:
                        elements of type radio are generally used in radio groups—collections of radio buttons describing a set of related options.

                    Only one radio button in a given group can be selected at the same time. 
                    Radio buttons are typically rendered as small circles, which are filled 
                    or highlighted when selected. 
                
                    https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input/radio-->

                <!--FIELDSET:
                        The <fieldset> HTML element is used to group several controls as well as labels (<label>) within a web form.
                        
                        https://developer.mozilla.org/en-US/docs/Web/HTML/Element/fieldset -->
                <fieldset>
                    <legend>Choose your Flavour</legend>
                    <div class="flex-container">
                        
                    </div>
                    <div>
                        <label for="vanilla">Vanilla</label>
                        <input type="radio" id="vanilla" name="flavours" value="vanilla">
                    </div>
                    <div>
                        <label for="chocolate">Chocolate</label>
                        <input type="radio" id="chocolate" name="flavours" value="chocolate">
                    </div>
                    <div>
                        <label for="cookies-cream">Cookies n Cream</label>
                        <input type="radio" id="cookies-cream" name="flavours" value="cookies-cream">
                    </div>
                    <div>
                        <label for="strawberry">Strawberry</label>
                        <input type="radio" id="strawberry" name="flavours" value="strawberry">
                    </div>
                </fieldset>
                <!-- The SPAN HTML element:
                    is a generic inline container for phrasing content, which does not inherently represent anything. It can be used to group elements for styling purposes (using the class or id attributes), or because they share attribute values, such as lang. It should be used only when no other semantic element is appropriate. <span> is very much like a <div> element, but <div> is a block-level element whereas a <span> is an inline-level element. -->
                <!-- https://developer.mozilla.org/en-US/docs/Web/HTML/Element/span -->
                <!--INPUT NUMBERS:  
                            <input type="number">
                Input number are used to let the user enter a number. They include built-in validation to reject non-numerical entries.

                The browser may opt to provide stepper arrows to let the user increase and decrease the value using their mouse or by tapping with a fingertip. -->
                <!-- https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input/number -->
                <!-- REQUIRED ATTRIBUTE: https://developer.mozilla.org/en-US/docs/Web/HTML/Attributes/required -->
                <fieldset>
                    <legend>Order Information</legend>
                    <div>
                        <label for="scoops">Pick the number of scoops (Limit of 1 - 5) <span>*Required</span></label>
                        <input type="number" id="scoops" min="1" max="5" name="scoops" required>
                    </div>
                    <div>
                        <label for="date">Pick up Date</label>
                        <input type="date" id="date" name="date">
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Account Information</legend>
                    <div>
                        <label for="name">Full Name <span>*Required</span></label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div>
                        <label for="password">Password (must be at least 10 characters) <span>*Required</span></label>
                    <input type="password" id="password" name="password" minlength="10" required>
                    </div>
                </fieldset>
                <div class="checkbox">
                    <input type="checkbox" id="agreement" value="agreed" name="agreement" required>
                    <label for="agreement">Select to agree to the terms.....</label>
                </div>
                <div>
                    <input type="submit" value="Place Order" name="submit" id="submit">
                </div>
            </form>
        </main>
    </div>
</body>

</html>
